name: wallpaper_setter
description:
  "A Flutter plugin for setting device wallpapers directly from your app.
  Supports home, lock, and both screen targets from file, URL, bytes, or a
  RepaintBoundary capture on Android, with graceful unsupported handling on
  iOS."

version: 2.0.0
homepage: https://github.com/iamporag/wallpaper_setter
repository: https://github.com/iamporag/wallpaper_setter.git
issue_tracker: https://github.com/iamporag/wallpaper_setter/issues
license: MIT

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        package: com.iamporag.wallpaper_setter
        pluginClass: WallpaperSetterPlugin
      ios:
        pluginClass: WallpaperSetterPlugin

  assets:
    - assets/demo.gif