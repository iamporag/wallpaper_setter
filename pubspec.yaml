name: wallpaper_setter
description:
  "A Flutter plugin for setting device wallpapers from a file, URL, bytes,
  or a RepaintBoundary capture, with graceful fallback where unsupported."

version: 2.1.0
homepage: https://github.com/iamporag/wallpaper_setter
repository: https://github.com/iamporag/wallpaper_setter.git
issue_tracker: https://github.com/iamporag/wallpaper_setter/issues
license: MIT

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        package: com.iamporag.wallpaper_setter
        pluginClass: WallpaperSetterPlugin
      ios:
        pluginClass: WallpaperSetterPlugin
      windows:
        dartPluginClass: UnsupportedWallpaperPlugin
        dartFileName: src/wallpaper_setter_unsupported.dart
      macos:
        dartPluginClass: UnsupportedWallpaperPlugin
        dartFileName: src/wallpaper_setter_unsupported.dart
      linux:
        dartPluginClass: UnsupportedWallpaperPlugin
        dartFileName: src/wallpaper_setter_unsupported.dart
      web:
        pluginClass: WallpaperPluginWeb
        fileName: src/wallpaper_setter_web.dart

  assets:
    - assets/demo.gif